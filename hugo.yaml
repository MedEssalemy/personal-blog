baseURL: 'https://medessalemy.github.io/personal-blog/'
languageCode: en-us
title: Essalemy
theme: PaperMod

pagination:
  pagerSize: 5

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

permalinks:
  posts: /posts/:contentbasename/

outputs:
  home:
    - HTML
    - RSS
    - JSON
  section:
    - HTML
    - RSS

minify:
  disableXML: true
  minifyOutput: true

markup:
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: false
    lineAnchors: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    noClasses: false
    style: monokai
    tabWidth: 4

params:
  env: production
  title: Essalemy
  description: 'Personal blog and portfolio - Exploring technology, project management, and personal growth'
  keywords: [Blog, Portfolio, Excel, Project Management, Technology, Automation]
  author: Mohamed Es-salemy
  
  DateFormat: "January 2, 2006"
  
  defaultTheme: auto
  disableThemeToggle: false
  
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableScrollToTop: false
  
  disableSpecial1stPost: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false
  comments: false
  
  assets:
    favicon: "favicon.ico"
    favicon16x16: "favicon-16x16.png"
    favicon32x32: "favicon-32x32.png"
    apple_touch_icon: "apple-touch-icon.png"
  
  label:
    text: "Essalemy"
    icon: "apple-touch-icon.png"
    iconHeight: 35
  
  profileMode:
    enabled: true
    title: "Mohamed Es-salemy"
    subtitle: "Project Management | Excel Automation | Technical Solutions"
    imageUrl: "images/profile.png"
    imageTitle: "Profile"
    imageWidth: 160
    imageHeight: 160
    buttons:
      - name: Blog
        url: /posts
      - name: About
        url: /about
      - name: LinkedIn
        url: https://www.linkedin.com/in/essalemy/
  
  socialIcons:
    - name: linkedin
      url: "https://www.linkedin.com/in/essalemy/"
    - name: github
      url: "https://github.com/MedEssalemy"
    - name: rss
      url: "index.xml"
  
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: true
  
  editPost:
    URL: "https://github.com/MedEssalemy/personal-blog/edit/main/content"
    Text: "Suggest Changes"
    appendFilePath: true
  
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: blog
      name: Blog
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: linkedin
      name: LinkedIn
      url: https://www.linkedin.com/in/essalemy/
      weight: 40